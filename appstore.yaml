# App contract v2: Web-LaTeX runs as pods, not as VMs (the VM versions, v1.x, are
# only reachable through their git tags). One editor per person.
apiVersion: appstore/v2
name: web-latex
runtime: kubernetes
scope: user
workload:
  containers:
    - name: editor
      # Built by .github/workflows/ci.yml. After changing image/, copy the new digest here.
      image: ghcr.io/dhbw-appstore-t3/apps/web-latex@sha256:afd4fd5f3466a0ec2d00188cc2159edbd87eaa742552d10282c21aa298fdcdd6
      # expose.path is the ingress route: only this path and below reach the pod. It must be / because the editor
      # lives at / (plus /compile, /pdf, ...); with /login only the login page was reachable and the redirect
      # after login ended in a 404 of the ingress. The app redirects / to /login itself when nobody is logged in.
      expose: { port: 8080, path: / }
      # An idle editor needs little; pdflatex bursts up to the limits.
      resources: { cpu: "2", memory: 2Gi, requests: { cpu: 100m, memory: 256Mi } }
      env:
        - { name: WEBLATEX_USER, from: user-name }
        - { name: WEBLATEX_PASSWORD, from: generated-password }
      writablePaths: [/tmp]
  # HOME of the container: projects, session key, TeX Live font cache.
  storage: { size: 2Gi, mountPath: /home/latex }
# What the editor may reach (the contract: app-registry README, "network"). TeX Live is in the image and the editor
# fetches nothing: no internet, and nobody can switch it on. Students' own TCP/UDP servers and clients between the
# editors of one deployment: a choice, off by default.
network:
  internet: { allowed: false, default: false }
  podNetwork: { allowed: true, default: false }
variables:
  # Optional starter project per team (must contain master.tex in the ZIP root);
  # without it the editor starts with the bundled demo project.
  - { name: starter, type: file, scope: team, ext: [zip], maxSize: 1Mi, mountPath: /opt/weblatex/starter/starter.zip }
access:
  - { type: url, template: "https://{workload}-{deployment}.{domain}" }
  - { type: password, from: generated-password, username: "{user}" }
